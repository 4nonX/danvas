# Builds the danvas image from source (Dockerfile), checks that it deploys,
# and publishes it to the GitHub container registry for amd64 and arm64:
#
#   pull request     build + deploy check, nothing published
#   push to main     build + deploy check, published as :main and :sha-<commit>
#   tag v0.1.6       build + deploy check, published as :v0.1.6, :0.1.6, :0.1
#                    and :latest (the tag must match the VERSION file), then
#                    the GitHub release, its notes taken from CHANGELOG.md
#   manual run       any branch or tag; published only when asked to
#
# The deploy check starts the freshly built image the way installs run it
# (deploy/compose.yaml with its Postgres) and requires the health check to
# answer with the expected version, the background-removal model to be served
# by the instance, and the app to load. Only an image that passes is pushed.
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes do not need a new image (tag pushes always build).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to the registry
        type: boolean
        default: false

permissions:
  # contents: write creates the GitHub release of a version tag.
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # A newer push to a branch or PR supersedes the running build; releases finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"; exit 1; }
            # The release notes come from the version's CHANGELOG section:
            # checked now rather than after the build.
            grep -q "^## ${v#v} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${v#v}"; exit 1; }
            version="$v"
          else
            # Builds between releases say which commit they are.
            version="$v+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "bg=$(node -p 'require("./package-lock.json").packages["node_modules/@imgly/background-removal"].version')" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # compose/compose.yml (the stack to paste into Dockge, Arcane, ...),
      # docker-compose.yml and deploy/compose.yaml are the same file, and the
      # two .env templates too. Without the three secrets the stack must refuse
      # to start and say what is missing.
      - name: Compose files
        run: |
          for f in docker-compose.yml deploy/compose.yaml; do
            cmp compose/compose.yml "$f" || { echo "::error::$f differs from compose/compose.yml"; exit 1; }
          done
          cmp compose/.env.example deploy/.env.example || { echo "::error::deploy/.env.example differs from compose/.env.example"; exit 1; }
          tmp=$(mktemp -d) && cp docker-compose.yml "$tmp/"
          if out=$(cd "$tmp" && docker compose config -q 2>&1); then echo "::error::the stack starts without secrets"; exit 1; fi
          echo "$out"
          case "$out" in *"in .env (openssl rand -hex 32)"*) ;; *) echo "::error::no clear message for the missing secrets"; exit 1;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for this runner's platform and load it into Docker for the deploy
      # check. The multi-arch build below reuses these layers from the cache.
      - name: Build (amd64, for the deploy check)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: danvas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy check (install kit)
        working-directory: deploy
        env:
          WANT_VERSION: ${{ steps.version.outputs.version }}
          BG_VERSION: ${{ steps.version.outputs.bg }}
        run: |
          cp .env.example .env
          for k in JWT_SECRET AI_SECRET POSTGRES_PASSWORD; do sed -i "s|^$k=$|$k=$(openssl rand -hex 32)|" .env; done
          sed -i "s|^DANVAS_VERSION=.*|DANVAS_VERSION=ci|" .env
          echo "DANVAS_IMAGE=danvas" >> .env
          mkdir -p data/storage data/pgdata
          docker compose up -d
          h=""
          for _ in $(seq 1 60); do
            h=$(curl -fsS http://127.0.0.1:8005/healthz 2>/dev/null || true)
            case "$h" in *'"status":"ok"'*) break;; esac
            sleep 3
          done
          echo "healthz: $h"
          case "$h" in *"\"version\":\"$WANT_VERSION\""*) ;; *) echo "::error::health check did not report $WANT_VERSION"; exit 1;; esac
          # Background removal is served by the instance itself.
          ct=$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8005/static-data/bg-removal/$BG_VERSION/resources.json")
          case "$ct" in *json*) echo "model served ($ct)";; *) echo "::error::background-removal model not served (content type: $ct)"; exit 1;; esac
          # The app itself loads.
          curl -fsSL http://127.0.0.1:8005/ | grep -qi "<html" || { echo "::error::the app page did not load"; exit 1; }
          # It runs as the unprivileged user (PUID 1000), not root.
          uid=$(docker compose exec -T app stat -c %u /proc/1)
          [ "$uid" = 1000 ] || { echo "::error::the app runs as uid $uid, not 1000"; exit 1; }
          echo "deploy check passed"

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v || true

      # Labels and annotations: GHCR shows the description and license of a
      # multi-arch image from the index annotations. The license is set
      # explicitly because GitHub does not detect Elastic-2.0.
      - uses: docker/metadata-action@v5
        id: meta
        if: env.PUBLISH == 'true'
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.title=danvas
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/deploy/README.md
          annotations: |
            org.opencontainers.image.title=danvas
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/deploy/README.md
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,enable={{is_default_branch}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64, arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The GitHub release of a version tag, once its images are published, so
      # tag, images and release page always match (install.sh and update.sh
      # find the latest release through it). Notes: the version's CHANGELOG
      # section. A release that already exists (made by hand, or by an earlier
      # attempt) is left as it is.
      - name: GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          v="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists already."; exit 0; fi
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > section.md
          {
            printf '**Deploy or update:** `ghcr.io/%s:%s` (amd64, arm64). New installs: [`compose/`](https://github.com/%s/blob/%s/compose/README.md). Existing stacks: set `DANVAS_VERSION=%s` (or keep it empty for `latest`), pull and redeploy.\n' "${REPO,,}" "$TAG" "$REPO" "$TAG" "$TAG"
            cat section.md
            printf '\nFull history: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$REPO" "$TAG"
          } > notes.md
          latest=true
          case "$v" in *-*) latest=false ;; esac
          gh release create "$TAG" --verify-tag --title "danvas $v" --notes-file notes.md --latest="$latest"
