# Builds the danvas image (Dockerfile) for amd64 and arm64 and publishes it to
# the GitHub container registry, so installs pull it instead of building:
#
#   ghcr.io/<owner>/danvas:v0.1.6   the release, as its git tag
#   ghcr.io/<owner>/danvas:0.1.6    the same, plain semver
#   ghcr.io/<owner>/danvas:0.1      newest 0.1.x
#   ghcr.io/<owner>/danvas:latest   newest release
#
# Runs on every version tag. The tag must match the VERSION file, which is
# also what the image reports on /healthz. A manual run builds any ref and only
# publishes when asked to (a branch publishes as its name, e.g. :main).
name: Container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build
        required: true
        default: main
      publish:
        description: Push the image to the registry
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check version
        id: version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          ref="${{ inputs.ref || github.ref_name }}"
          case "$ref" in
            v[0-9]*) [ "$ref" = "v$v" ] || { echo "::error::tag $ref does not match VERSION ($v)"; exit 1; } ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Building v$v from $ref"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=match,pattern=v\d+\.\d+\.\d+.*,value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref_name }}
            type=raw,value=${{ inputs.ref }},enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(inputs.ref, 'v') }}
          flavor: |
            latest=${{ startsWith(inputs.ref || github.ref_name, 'v') && !contains(inputs.ref || github.ref_name, '-') }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
