# danvas: the complete stack (app + Postgres) from the published image
# ghcr.io/4nonx/danvas (amd64, arm64). Self-contained: paste it into Dockge,
# Arcane, Portainer or any Compose tool, or run `docker compose up -d` next to
# it. The same file is compose/compose.yml, docker-compose.yml at the
# repository root and deploy/compose.yaml (the install kit's); CI keeps them
# identical.
#
# Settings come from the .env next to it; the template with every setting
# explained is .env.example in compose/ (and deploy/). Required: JWT_SECRET, AI_SECRET and
# POSTGRES_PASSWORD (each `openssl rand -hex 32`); a missing one stops the
# deploy with a message saying so. Keep .env safe: without AI_SECRET, stored
# AI keys and MFA secrets cannot be decrypted.
#
# Data lives in ./data next to this file (DATA_DIR to move it): data/pgdata is
# the database, data/storage the uploads. Updates: set DANVAS_VERSION to the
# new release (or keep `latest`), then pull and redeploy; migrations run on
# start. To build from a clone instead of pulling, see deploy/README.md.
name: danvas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: danvas
      POSTGRES_DB: danvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
    volumes:
      - ${DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danvas -d danvas"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start creates the database, which takes a while on slow disks.
      start_period: 60s

  app:
    image: ${DANVAS_IMAGE:-ghcr.io/4nonx/danvas}:${DANVAS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Default: reachable from this host only (put a reverse proxy in front).
      # Set BIND_ADDR=0.0.0.0 to open it to the LAN directly.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8005}:8005"
    # Optional extras (OIDC_*, SSL_CERT_FILE, ...) are read from .env when it
    # exists; the settings below also work where a tool keeps the variables
    # without writing a .env file.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8005"
      NODE_ENV: production
      DB_AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://danvas:${POSTGRES_PASSWORD}@db:5432/danvas?schema=public
      REDIS_URL: ""
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/.data/storage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      AI_SECRET: ${AI_SECRET:?set AI_SECRET in .env (openssl rand -hex 32)}
      APP_URL: ${APP_URL:-http://localhost:8005}
      # false: sign-in works over plain http. Set true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      INSTANCE_ACCENT: ${INSTANCE_ACCENT:-}
      INSTANCE_LOCALE: ${INSTANCE_LOCALE:-}
      BUILTIN_TEMPLATES: ${BUILTIN_TEMPLATES:-}
      BRAND_STARTER_KIT: ${BRAND_STARTER_KIT:-}
      ASSET_QUOTA_BYTES: ${ASSET_QUOTA_BYTES:-}
      AUTH_PASSWORD_SIGNUP_ENABLED: ${AUTH_PASSWORD_SIGNUP_ENABLED:-}
      # Magic links need email delivery, which a fresh stack does not have.
      AUTH_MAGICLINK_LOGIN_ENABLED: ${AUTH_MAGICLINK_LOGIN_ENABLED:-false}
    # The background-removal model ships inside the image (STATIC_DATA_DIR).
    volumes:
      - ${DATA_DIR:-./data}/storage:/app/.data/storage
