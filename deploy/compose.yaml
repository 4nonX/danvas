# danvas: run on any Docker host. Builds the image from this repository (no
# registry access needed). Setup and updates: deploy/README.md, install.sh,
# update.sh.
name: danvas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: danvas
      POSTGRES_DB: danvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danvas -d danvas"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start creates the database, which takes a while on slow disks.
      start_period: 60s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${DANVAS_VERSION:-local}
    image: danvas-local:${DANVAS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Default: reachable from this host only (put a reverse proxy in front).
      # Set BIND_ADDR=0.0.0.0 for direct access from the LAN.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8005}:8005"
    env_file: .env
    environment:
      PORT: "8005"
      NODE_ENV: production
      DB_AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://danvas:${POSTGRES_PASSWORD}@db:5432/danvas?schema=public
      REDIS_URL: ""
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/.data/storage
      STATIC_DATA_DIR: /app/static-data
    volumes:
      - ./data/storage:/app/.data/storage
      - ./data/static-data:/app/static-data:ro
