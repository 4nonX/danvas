# danvas: run on any Docker host from the published image
# (ghcr.io/4nonx/danvas, amd64 and arm64). Setup and updates: README.md here;
# install.sh and update.sh do every step for you.
#
# The version to run is DANVAS_VERSION in .env (a release tag such as v0.1.6).
# To build the image from a clone of the repository instead, add the build
# override: COMPOSE_FILE=compose.yaml:compose.build.yaml in .env
# (install.sh --build sets it).
name: danvas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: danvas
      POSTGRES_DB: danvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danvas -d danvas"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start creates the database, which takes a while on slow disks.
      start_period: 60s

  app:
    image: ${DANVAS_IMAGE:-ghcr.io/4nonx/danvas}:${DANVAS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Default: reachable from this host only (put a reverse proxy in front).
      # Set BIND_ADDR=0.0.0.0 for direct access from the LAN.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8005}:8005"
    env_file: .env
    environment:
      PORT: "8005"
      NODE_ENV: production
      DB_AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://danvas:${POSTGRES_PASSWORD}@db:5432/danvas?schema=public
      REDIS_URL: ""
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/.data/storage
    # The background-removal model ships inside the image (STATIC_DATA_DIR).
    volumes:
      - ./data/storage:/app/.data/storage
